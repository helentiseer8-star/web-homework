<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تواصل معنا</title>
</head>
<body>

    <h2>تواصل معنا</h2>

    <!-- تنبيه: يجب إضافة enctype عند استخدام حقل رفع الملفات -->
    <form action="contact.html" method="POST" enctype="multipart/form-data">
        <!-- موضوع الرسالة -->
        <div>
            <label for="subject">موضوع الرسالة:</label><br>
            <input type="text" id="subject" name="subject" required placeholder="أدخل عنوان الموضوع">
        </div>
        <br>

        <!-- مساحة نصية كبيرة -->
        <div>
            <label for="message">الرسالة:</label><br>
            <textarea id="message" name="message" rows="5" cols="40" required placeholder="اكتب استفسارك أو رأيك هنا..."></textarea>
        </div>
        <br>

        <!-- حقل رفع ملف/صورة -->
        <div>
            <label for="file">إرفاق ملف أو صورة:</label><br>
            <input type="file" id="file" name="attachment">
        </div>
        <br>

        <!-- زر الإرسال -->
        <div>
            <button type="submit">إرسال (Send)</button>
        </div>
    </form>

    <br>
    <hr>
    <p>
        <a href="login.html">العودة لتسجيل الدخول</a> | 
        <a href="register.html">الذهاب لإنشاء حساب</a>
    </p>

</body>
</html>
