<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
</head>
<body>

    <h2>تسجيل الدخول</h2>

    <!-- النموذج ينقل المستخدم عند الضغط على Login إلى صفحة التواصل -->
    <form action="contact.html" method="POST">
        <div>
            <label for="username">اسم المستخدم:</label><br>
            <input type="text" id="username" name="username" required placeholder="أدخل اسم المستخدم">
        </div>
        <br>
        <div>
            <label for="password">كلمة المرور:</label><br>
            <input type="password" id="password" name="password" required placeholder="أدخل كلمة المرور">
        </div>
        <br>
        <div>
            <button type="submit">دخول (Login)</button>
        </div>
    </form>

    <br>
    <hr>
    <!-- رابط ينقل لصفحة إنشاء حساب جديد -->
    <p>ليس لديك حساب؟ <a href="register.html">أنشئ حساباً جديداً من هنا</a></p>

</body>
</html>
